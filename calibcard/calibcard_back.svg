    <circle cx="0" cy="3" r="6.0" fill="none" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="1.2, 0.8" />
    <text x="0" y="11.5" text-anchor="middle" class="micro">Ø 12mm</text>
  </g>

