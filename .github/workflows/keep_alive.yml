name: Keep Bal-Setu Service Warm

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier 15-minute sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-space:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Bal-Setu Web Service
        run: |
          TARGET_URL="${{ secrets.RENDER_SERVICE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://balsetu.onrender.com"
          fi
          echo "Pinging Bal-Setu at $TARGET_URL..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -L "$TARGET_URL/api/health" || echo "000")
          echo "HTTP Response Code: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ Bal-Setu is awake and healthy!"
          else
            echo "⚠️ Non-200 or Cold-start wakeup triggered (Code: $HTTP_CODE)."
          fi
